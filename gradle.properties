org.gradle.jvmargs=-Xmx2g -Xss2m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.caching=false
# 这台机器内存紧：关掉文件监听（它的 native watcher 曾以 std::bad_alloc 把守护进程打崩），
# 限制并行 worker，Kotlin 放进程内编译，避免再起一个守护进程抢内存。
org.gradle.vfs.watch=false
org.gradle.parallel=false
org.gradle.workers.max=2
# 这台机器内存紧，Kotlin 守护进程起不来（setup 时崩过），直接放进 Gradle 进程内编译
kotlin.compiler.execution.strategy=in-process
# 注意：这里原先写死了本地代理 127.0.0.1:18080（云沙箱环境遗留）。
# 当该代理没有监听时，所有 Maven 依赖都会下载失败，因此默认关闭；
# 若你的网络确实需要走代理，取消下面 4 行注释并改成自己的地址。
#systemProp.http.proxyHost=127.0.0.1
#systemProp.http.proxyPort=18080
#systemProp.https.proxyHost=127.0.0.1
#systemProp.https.proxyPort=18080